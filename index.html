<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BICHI: Invisibles en la ciudad</title>

  <!-- Tipografías oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Portada -->
  <section class="portada" id="portada">
    <img class="portada-logo" src="assets/logo-bichi.png" alt="BICHI: Invisibles en la ciudad">
    <button class="btn-play" id="btn-jugar" aria-label="Jugar"></button>
  </section>

  <!-- Pantalla de niveles -->
  <section class="niveles" id="niveles" hidden>
    <div class="niveles-panel">
      <h1 class="niveles-titulo">Niveles</h1>

      <div class="niveles-lista">

        <!-- Balcón: desbloqueado -->
        <button class="nivel" id="btn-nivel-balcon">
          <div class="nivel-foto">
            <img src="assets/niveles/nivel-balcon.png" alt="Mapa del balcón">
          </div>
          <div class="nivel-info">
            <h2 class="nivel-nombre">Balcón</h2>
            <p class="nivel-desc">Aquí empieza tu aventura.</p>
          </div>
        </button>

        <!-- Patio: bloqueado -->
        <button class="nivel nivel-bloqueado" disabled aria-label="Patio, bloqueado">
          <div class="nivel-foto">
            <img src="assets/niveles/nivel-patio.png" alt="">
            <svg class="candado" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 10V8a5 5 0 0 1 10 0v2" fill="none" stroke="#6F513A" stroke-width="2.5" stroke-linecap="round"/>
              <rect x="5" y="10" width="14" height="11" rx="3" fill="#6F513A"/>
              <circle cx="12" cy="15.5" r="1.6" fill="#F4D06F"/>
            </svg>
          </div>
          <div class="nivel-info">
            <h2 class="nivel-nombre">Patio</h2>
            <p class="nivel-desc">Bloqueado</p>
          </div>
        </button>

        <!-- Próximamente -->
        <div class="nivel nivel-proximamente">
          <h2 class="nivel-nombre">Próximamente</h2>
        </div>

      </div>
    </div>
  </section>

  <!-- Pantalla de carga -->
  <section class="carga" id="carga" hidden>
    <img class="carga-icono" src="assets/iconos/icono-carga.gif" alt="">
    <p class="carga-texto" role="status">Cargando…</p>
  </section>

  <!-- Partida: balcón -->
  <section class="partida" id="partida" hidden>
    <div class="escena">

           <!-- Fondo: el balcón limpio queda debajo y la suciedad se dibuja encima para poder borrarla -->
      <div class="escena-fondo" id="escena-fondo">
        <img class="fondo-limpio" src="assets/escenarios/balcon-limpio.png" alt="">
        <canvas class="fondo-sucio" id="fondo-sucio" role="img" aria-label="Balcón en mal estado, con telarañas y macetas rotas"></canvas>
      </div>

      <!-- Menú izquierdo (todavía sin funciones: botones apagados) -->
                 <nav class="menu-izq" id="menu-izq" aria-label="Menú del juego">
        <button class="menu-boton" id="menu-tienda" disabled aria-label="Tienda (próximamente)">
          <img src="assets/iconos/icono-tienda.png" alt="">
        </button>
        <button class="menu-boton" id="menu-enciclopedia" disabled aria-label="Enciclopedia (próximamente)">
          <img src="assets/iconos/icono-enciclopedia.png" alt="">
        </button>
        <button class="menu-boton" id="menu-hotel" disabled aria-label="Hotel de insectos (próximamente)">
          <img src="assets/iconos/icono-hotel.png" alt="">
        </button>
      </nav>

      <!-- Saldo de BichiPesos -->
      <div class="saldo" id="saldo">
               <img src="assets/iconos/icono-bichipeso.png" alt="BichiPesos">
        <span id="saldo-cantidad">0</span>
      </div>

      <!-- Barra de objetos -->
      <div class="hotbar" aria-label="Barra de objetos">
        <button class="slot" id="slot-esponja" disabled aria-label="Esponja">
          <img src="assets/objetos/esponja.webp" alt="">
        </button>
      </div>

                  <!-- Tienda -->
      <section class="tienda" id="tienda" hidden aria-label="Tienda">
        <div class="tienda-cabecera">
          <h2 class="tienda-titulo">Tienda</h2>
          <button class="tienda-cerrar" id="tienda-cerrar" aria-label="Cerrar tienda">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#6F513A" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="tienda-seccion" id="tienda-herramientas">
          <h3 class="tienda-subtitulo">Herramientas</h3>
          <div class="tienda-lista" id="lista-herramientas"></div>
        </div>

        <div class="tienda-seccion" id="tienda-semillas">
          <h3 class="tienda-subtitulo">Semillas</h3>
          <div class="tienda-lista" id="lista-semillas"></div>
        </div>

        <p class="tienda-aviso" id="tienda-aviso" role="status"></p>
      </section>
      <!-- Esponja que sigue al mouse cuando está seleccionada -->
      <img class="esponja-cursor" id="esponja-cursor" src="assets/objetos/esponja.webp" alt="" hidden>
      <div class="guia" id="guia" hidden>
        <div class="globo" role="status">
          <p class="globo-nombre">Pololo verde</p>
          <p class="globo-texto" id="globo-texto"></p>
          <div class="globo-acciones">
            <button class="globo-siguiente" id="btn-siguiente" aria-label="Siguiente">
              <img src="assets/iconos/icono-flecha.png" alt="">
            </button>
          </div>
        </div>

        <div class="guia-flota">
          <div class="guia-capas">
            <img class="capa ala ala-izq" src="assets/pololo/pololo-ala-izq.png" alt="">
            <img class="capa ala ala-der" src="assets/pololo/pololo-ala-der.png" alt="">
            <img class="pololo-cuerpo" src="assets/pololo/pololo-cuerpo.png" alt="Pololo verde, tu guía">
            <img class="capa parpados" src="assets/pololo/pololo-parpados.png" alt="">
          </div>
        </div>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
